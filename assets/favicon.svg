<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Top-Left QR Finder Pattern -->
  <rect x="10" y="10" width="18" height="18" rx="4" fill="none" stroke="url(#primary-grad)" stroke-width="3" />
  <rect x="15" y="15" width="8" height="8" rx="2" fill="#06b6d4" />
  
  <!-- Top-Right QR Finder Pattern -->
  <rect x="36" y="10" width="18" height="18" rx="4" fill="none" stroke="url(#primary-grad)" stroke-width="3" />
  <rect x="41" y="15" width="8" height="8" rx="2" fill="#06b6d4" />
  
  <!-- Bottom-Left QR Finder Pattern -->
  <rect x="10" y="36" width="18" height="18" rx="4" fill="none" stroke="url(#primary-grad)" stroke-width="3" />
  <rect x="15" y="41" width="8" height="8" rx="2" fill="#06b6d4" />
  
  <!-- Barcode Vertical Slits in Bottom-Right -->
  <rect x="36" y="36" width="3" height="18" rx="1.5" fill="#3b82f6" />
  <rect x="42" y="36" width="5" height="18" rx="1.5" fill="#06b6d4" />
  <rect x="49" y="36" width="2" height="18" rx="1" fill="#60a5fa" />
  <rect x="53" y="36" width="4" height="18" rx="1.5" fill="#38bdf8" />
</svg>

# GitHub Actions test gate. Kept on the testing-upgrade branch until the owner approves "go live".
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: tests/e2e
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Test integrity
        run: npm run test:integrity

      - name: Test lint
        run: npm run test:lint

      - name: Run static, desktop and phone suites
        id: run
        continue-on-error: true
        run: npm run test:ci

      - name: Machine-written summary
        run: |
          npm run test:summary | tee summary.txt
          cat summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the test command failed
        if: steps.run.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ github.sha }}
          path: |
            tests/e2e/reports/
            tests/e2e/summary.txt
          retention-days: 30
